name: Deploy Bmapz

on:
  push:
    branches: [main]

jobs:
  deploy-frontend:
    name: Build & Deploy Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Strip null bytes from all source files
        run: |
          find . -not -path './.git/*' \( -name '*.js' -o -name '*.jsx' -o -name '*.ts' -o -name '*.tsx' -o -name '*.json' -o -name '*.css' -o -name '*.html' \) | while IFS= read -r f; do
            tr -d '\000' < "$f" > "$f.tmp" && mv "$f.tmp" "$f"
          done

      - name: Write correct vite.config.js
        run: |
          cat > vite.config.js << 'VITEEOF'
          import react from '@vitejs/plugin-react';
          import { defineConfig } from 'vite';
          import path from 'path';
          import { fileURLToPath } from 'url';
          const __dirname = path.dirname(fileURLToPath(import.meta.url));
          export default defineConfig({
            plugins: [react()],
            resolve: { alias: { '@': path.resolve(__dirname, './frontend-src') } },
            root: '.',
            publicDir: 'public',
            build: { outDir: 'dist', rollupOptions: { input: 'index.html' } },
            server: { port: 5173, proxy: { '/api': { target: process.env.VITE_API_URL || 'http://localhost:3001', changeOrigin: true } } },
          });
          VITEEOF

      - name: Install dependencies
        run: cp frontend-package.json package.json && npm install

      - name: Build frontend (Vite)
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=bmapz --branch=main
